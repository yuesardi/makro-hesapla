<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Makro & Kalori Takip</title>
    <style>
        :root {
            --bg-main: #0d0d0d;
            --bg-card: #18181b;
            --bg-input: #27272a;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent-red: #e11d48;
            --border-color: #2e2e32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 135px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header h1 span {
            color: var(--accent-red);
        }

        .header-right {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .tab-btn, .key-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
            color: var(--text-main);
        }

        .key-btn.configured {
            border-color: #22c55e;
            color: #4ade80;
        }

        /* API Key Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            width: 100%;
            max-width: 380px;
        }

        .modal-box h3 {
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .modal-box p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 12px;
        }

        /* Öğün Kartları */
        .meal-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
            transition: opacity 0.25s ease;
        }

        .meal-card.locked {
            border-color: #3f3f46;
            background-color: #121214;
        }

        .meal-card.locked .rows-container,
        .meal-card.locked .add-row-btn {
            pointer-events: none;
            opacity: 0.55;
        }

        .meal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .meal-title {
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meal-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 16px;
            background-color: var(--accent-red);
            border-radius: 2px;
        }

        .lock-badge {
            font-size: 0.75rem;
            color: var(--accent-red);
            font-weight: 600;
            display: none;
        }

        .meal-card.locked .lock-badge {
            display: inline;
        }

        /* Satır Yapısı & Açılır Liste */
        .food-row-wrapper {
            position: relative;
            margin-bottom: 8px;
        }

        .food-row {
            display: grid;
            grid-template-columns: 60px 54px 1fr 56px;
            gap: 6px;
            align-items: center;
        }

        select, input {
            background-color: var(--bg-input);
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 9px 6px;
            border-radius: 8px;
            font-size: 0.85rem;
            width: 100%;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent-red);
        }

        input[type="number"] {
            text-align: center;
        }

        .row-kcal {
            text-align: right;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
        }

        .row-kcal small {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 0.7rem;
        }

        /* AI Seçim Listesi */
        .suggestions-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #202024;
            border: 1px solid var(--accent-red);
            border-radius: 10px;
            margin-top: 4px;
            z-index: 50;
            box-shadow: 0 8px 24px rgba(0,0,0,0.85);
            overflow: hidden;
        }

        .suggestion-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:active {
            background-color: var(--accent-red);
        }

        .sug-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .sug-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .sug-kcal {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-red);
            white-space: nowrap;
        }

        /* Öğün Altı Kontroller */
        .meal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .add-row-btn {
            background: transparent;
            border: 1px dashed var(--text-muted);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .toggle-lock-btn {
            background-color: var(--accent-red);
            color: var(--text-main);
            border: none;
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .meal-card.locked .toggle-lock-btn {
            background-color: var(--bg-input);
            border: 1px solid var(--text-muted);
        }

        .meal-summary {
            margin-top: 10px;
            background-color: #0d0d0d;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .meal-summary strong {
            color: var(--text-main);
        }

        .meal-summary .kcal-highlight {
            color: var(--accent-red);
            font-weight: 700;
        }

        /* Geçmiş Deposu Stilleri */
        .history-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 8px;
        }

        .backup-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .history-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .history-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .history-date {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .history-kcal {
            color: var(--accent-red);
            font-weight: 800;
            font-size: 1.05rem;
        }

        .history-macros {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        .history-details {
            display: none;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .history-card.open .history-details {
            display: block;
        }

        .history-meal-item {
            margin-bottom: 6px;
        }

        .history-meal-item strong {
            color: var(--text-main);
        }

        .history-card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .share-history-btn {
            background-color: var(--accent-red);
            border: none;
            color: var(--text-main);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .delete-history-btn {
            background: transparent;
            border: 1px solid #52525b;
            color: #a1a1aa;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* Gün Sonu Sabit Bar */
        .daily-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #141417;
            border-top: 2px solid var(--accent-red);
            padding: 12px 16px;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.8);
        }

        .daily-footer-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 6px;
        }

        .daily-footer-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .footer-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .reset-btn, .share-day-btn {
            background: transparent;
            border: 1px solid #52525b;
            color: var(--text-main);
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 0.73rem;
            font-weight: 600;
            cursor: pointer;
        }

        .share-day-btn {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .save-day-btn {
            background-color: var(--accent-red);
            border: none;
            color: var(--text-main);
            padding: 5px 11px;
            border-radius: 6px;
            font-size: 0.73rem;
            font-weight: 700;
            cursor: pointer;
        }

        .daily-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .macro-group {
            display: flex;
            gap: 12px;
        }

        .macro-item span {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .macro-item strong {
            color: var(--text-main);
            font-weight: 700;
        }

        .total-kcal {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--accent-red);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>MAKRO<span>TAKİP</span></h1>
        <div class="header-right">
            <button class="key-btn" id="ai-key-btn" onclick="openKeyModal()">🔑 AI</button>
            <button class="tab-btn active" id="tab-daily" onclick="switchTab('daily')">Günlük</button>
            <button class="tab-btn" id="tab-history" onclick="switchTab('history')">Geçmiş (<span id="history-count">0</span>)</button>
        </div>
    </header>

    <!-- API KEY MODAL -->
    <div class="modal-overlay hidden" id="key-modal">
        <div class="modal-box">
            <h3>Gemini AI Bağlantısı</h3>
            <p>Besinleri doğru yorumlayıp seçenek sunması için Google AI Studio API anahtarını gir. Anahtar sadece kendi cihazında saklanır.</p>
            <input type="password" id="gemini-key-input" placeholder="AIzaSy...">
            <div class="modal-actions">
                <button class="reset-btn" onclick="closeKeyModal()">Kapat</button>
                <button class="save-day-btn" onclick="saveApiKey()">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- GÜNLÜK EKRANI -->
    <div id="daily-view">
        <div id="meals-wrapper"></div>
    </div>

    <!-- GEÇMİŞ DEPOSU EKRANI -->
    <div id="history-view" class="hidden">
        <div class="history-controls">
            <span style="font-size: 0.8rem; color: var(--text-muted);">Detay için güne dokun</span>
            <div>
                <button class="backup-btn" onclick="exportBackup()">Yedek İndir</button>
                <button class="backup-btn" onclick="document.getElementById('import-file').click()">Yükle</button>
                <input type="file" id="import-file" accept=".json" class="hidden" onchange="importBackup(event)">
            </div>
        </div>
        <div id="history-list"></div>
    </div>

    <!-- SABİT ALT BAR -->
    <div class="daily-footer" id="daily-footer">
        <div class="daily-footer-top">
            <span class="daily-footer-title" id="matched-status">Gün Sonu</span>
            <div class="footer-actions">
                <button class="reset-btn" onclick="resetDay()">Temizle</button>
                <button class="share-day-btn" onclick="shareCurrentDay()">Paylaş</button>
                <button class="save-day-btn" onclick="saveDayToHistory()">Kaydet</button>
            </div>
        </div>
        <div class="daily-stats">
            <div class="macro-group">
                <div class="macro-item"><span>P:</span> <strong id="total-p">0g</strong></div>
                <div class="macro-item"><span>K:</span> <strong id="total-c">0g</strong></div>
                <div class="macro-item"><span>Y:</span> <strong id="total-f">0g</strong></div>
            </div>
            <div class="total-kcal" id="total-kcal">0 kcal</div>
        </div>
    </div>

    <script>
        const MEAL_NAMES = ["Sabah", "Ara Öğün 1", "Öğlen", "Ara Öğün 2", "Akşam", "Ara Öğün 3"];
        const aiCache = {};

        let geminiApiKey = localStorage.getItem('gemini_api_key') || '';
        let appState = JSON.parse(localStorage.getItem('macroAppState_v2')) || initDefaultState();
        let historyData = JSON.parse(localStorage.getItem('macroHistory_v1')) || [];

        function initDefaultState() {
            return MEAL_NAMES.map(name => ({
                name: name,
                locked: false,
                rows: Array.from({ length: 4 }, () => ({
                    unit: 'gr',
                    amount: '',
                    food: '',
                    selectedBase: null,
                    macros: { p: 0, c: 0, f: 0, kcal: 0 }
                }))
            }));
        }

        function saveState() {
            localStorage.setItem('macroAppState_v2', JSON.stringify(appState));
        }

        function saveHistoryStorage() {
            localStorage.setItem('macroHistory_v1', JSON.stringify(historyData));
            document.getElementById('history-count').innerText = historyData.length;
        }

        function updateKeyButtonUI() {
            const btn = document.getElementById('ai-key-btn');
            if (geminiApiKey) {
                btn.classList.add('configured');
                btn.innerText = '🔑 AI Aktif';
            } else {
                btn.classList.remove('configured');
                btn.innerText = '🔑 AI Ekle';
            }
        }

        function openKeyModal() {
            document.getElementById('gemini-key-input').value = geminiApiKey;
            document.getElementById('key-modal').classList.remove('hidden');
        }

        function closeKeyModal() {
            document.getElementById('key-modal').classList.add('hidden');
        }

        function saveApiKey() {
            geminiApiKey = document.getElementById('gemini-key-input').value.trim();
            localStorage.setItem('gemini_api_key', geminiApiKey);
            updateKeyButtonUI();
            closeKeyModal();
        }

        function switchTab(tab) {
            const dailyView = document.getElementById('daily-view');
            const historyView = document.getElementById('history-view');
            const footer = document.getElementById('daily-footer');
            const tabDaily = document.getElementById('tab-daily');
            const tabHistory = document.getElementById('tab-history');

            if (tab === 'daily') {
                dailyView.classList.remove('hidden');
                footer.classList.remove('hidden');
                historyView.classList.add('hidden');
                tabDaily.classList.add('active');
                tabHistory.classList.remove('active');
            } else {
                dailyView.classList.add('hidden');
                footer.classList.add('hidden');
                historyView.classList.remove('hidden');
                tabDaily.classList.remove('active');
                tabHistory.classList.add('active');
                renderHistory();
            }
        }

        function renderApp() {
            const wrapper = document.getElementById('meals-wrapper');
            wrapper.innerHTML = '';

            appState.forEach((meal, mIdx) => {
                const card = document.createElement('div');
                card.className = `meal-card ${meal.locked ? 'locked' : ''}`;
                card.id = `meal-card-${mIdx}`;

                let rowsHtml = '';
                meal.rows.forEach((row, rIdx) => {
                    rowsHtml += `
                        <div class="food-row-wrapper">
                            <div class="food-row">
                                <select onchange="handleUnitOrAmountChange(${mIdx}, ${rIdx}, 'unit', this.value)">
                                    <option value="adet" ${row.unit === 'adet' ? 'selected' : ''}>Adet</option>
                                    <option value="gr" ${row.unit === 'gr' ? 'selected' : ''}>Gr</option>
                                    <option value="ml" ${row.unit === 'ml' ? 'selected' : ''}>Ml</option>
                                </select>
                                <input type="number" inputmode="decimal" placeholder="0" value="${row.amount}" 
                                    oninput="handleUnitOrAmountChange(${mIdx}, ${rIdx}, 'amount', this.value)">
                                <input type="text" placeholder="Ürün adı..." value="${row.food}" 
                                    oninput="handleFoodInput(${mIdx}, ${rIdx}, this.value)">
                                <div class="row-kcal" id="kcal-${mIdx}-${rIdx}">
                                    ${Math.round(row.macros.kcal)} <small>kcal</small>
                                </div>
                            </div>
                            <div class="suggestions-dropdown hidden" id="sug-${mIdx}-${rIdx}"></div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="meal-header">
                        <div class="meal-title">${meal.name}</div>
                        <span class="lock-badge">🔒 Kilitli</span>
                    </div>
                    <div class="rows-container">${rowsHtml}</div>
                    <div class="meal-actions">
                        <button class="add-row-btn" onclick="addRow(${mIdx})">+ Satır Ekle</button>
                        <button class="toggle-lock-btn" onclick="toggleLock(${mIdx})">
                            ${meal.locked ? 'Düzenle' : 'Tamam'}
                        </button>
                    </div>
                    <div class="meal-summary" id="summary-${mIdx}"></div>
                `;

                wrapper.appendChild(card);
                updateMealSummary(mIdx);
            });

            updateDailyTotals();
            updateKeyButtonUI();
            document.getElementById('history-count').innerText = historyData.length;
        }

        function addRow(mIdx) {
            appState[mIdx].rows.push({
                unit: 'gr',
                amount: '',
                food: '',
                selectedBase: null,
                macros: { p: 0, c: 0, f: 0, kcal: 0 }
            });
            saveState();
            renderApp();
        }

        function toggleLock(mIdx) {
            appState[mIdx].locked = !appState[mIdx].locked;
            saveState();
            renderApp();
        }

        async function searchFoodOptions(query) {
            const cleanQuery = query.trim().toLowerCase();
            if (!cleanQuery) return [];
            if (aiCache[cleanQuery]) return aiCache[cleanQuery];

            document.getElementById('matched-status').innerText = "AI seçenekleri hazırlıyor...";

            if (geminiApiKey) {
                try {
                    const prompt = `Sen bir beslenme ve makro veritabanısın. Kullanıcının yazdığı "${query}" ifadesi için Türkiye'de tüketilen en yaygın 4 farklı seçeneği (örneğin tam yağlı, yarım yağlı/light, pişmiş/çiğ veya farklı çeşitleri) 100 gram/ml başına besin değerleriyle birlikte SADECE saf JSON dizisi olarak döndür. Markdown veya açıklama ekleme.
Format: [{"name": "Ürün Çeşidi Adı", "p": 10.5, "c": 5.0, "f": 18.0, "kcal": 220, "unitWeight": 30}]
Not: unitWeight, 1 adet/porsiyonun ortalama gramajıdır.`;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) {
                        const parsed = JSON.parse(text);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            aiCache[cleanQuery] = parsed;
                            document.getElementById('matched-status').innerText = "Listeden seçim yap";
                            return parsed;
                        }
                    }
                } catch (err) {
                    console.error("Gemini AI hatası:", err);
                }
            }

            try {
                const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(cleanQuery)}&search_simple=1&action=process&json=1&page_size=5`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.products && data.products.length > 0) {
                    const options = data.products
                        .filter(p => p.nutriments && (p.nutriments['energy-kcal_100g'] || p.nutriments['energy-kcal']))
                        .slice(0, 4)
                        .map(p => ({
                            name: `${p.brands ? p.brands + ' - ' : ''}${p.product_name || cleanQuery}`,
                            p: parseFloat(p.nutriments.proteins_100g || 0),
                            c: parseFloat(p.nutriments.carbohydrates_100g || 0),
                            f: parseFloat(p.nutriments.fat_100g || 0),
                            kcal: parseFloat(p.nutriments['energy-kcal_100g'] || p.nutriments['energy-kcal'] || 0),
                            unitWeight: parseFloat(p.serving_quantity || 100)
                        }));
                    aiCache[cleanQuery] = options;
                    document.getElementById('matched-status').innerText = "Listeden seçim yap";
                    return options;
                }
            } catch (e) {
                console.error(e);
            }

            document.getElementById('matched-status').innerText = "Sonuç bulunamadı";
            return [];
        }

        let debounceTimers = {};

        function handleFoodInput(mIdx, rIdx, value) {
            const row = appState[mIdx].rows[rIdx];
            row.food = value;
            saveState();

            const timerKey = `${mIdx}-${rIdx}`;
            clearTimeout(debounceTimers[timerKey]);

            const sugBox = document.getElementById(`sug-${mIdx}-${rIdx}`);
            if (!value.trim() || value.trim().length < 2) {
                sugBox.classList.add('hidden');
                return;
            }

            debounceTimers[timerKey] = setTimeout(async () => {
                const options = await searchFoodOptions(value);
                if (options.length === 0) {
                    sugBox.classList.add('hidden');
                    return;
                }

                sugBox.innerHTML = options.map(opt => `
                    <div class="suggestion-item" onclick='selectFoodOption(${mIdx}, ${rIdx}, ${JSON.stringify(opt).replace(/'/g, "&apos;")})'>
                        <div>
                            <div class="sug-name">${opt.name}</div>
                            <div class="sug-meta">100g: P ${opt.p}g · K ${opt.c}g · Y ${opt.f}g</div>
                        </div>
                        <div class="sug-kcal">${Math.round(opt.kcal)} kcal</div>
                    </div>
                `).join('');
                sugBox.classList.remove('hidden');
            }, 500);
        }

        function selectFoodOption(mIdx, rIdx, option) {
            const row = appState[mIdx].rows[rIdx];
            row.food = option.name;
            row.selectedBase = option;

            const wrapper = document.getElementById(`sug-${mIdx}-${rIdx}`).parentElement;
            wrapper.querySelector('input[type="text"]').value = option.name;
            document.getElementById(`sug-${mIdx}-${rIdx}`).classList.add('hidden');
            document.getElementById('matched-status').innerText = `Seçildi: ${option.name}`;

            recalculateRow(mIdx, rIdx);
        }

        function handleUnitOrAmountChange(mIdx, rIdx, field, value) {
            appState[mIdx].rows[rIdx][field] = value;
            recalculateRow(mIdx, rIdx);
        }

        function recalculateRow(mIdx, rIdx) {
            const row = appState[mIdx].rows[rIdx];
            const amount = parseFloat(row.amount);
            const kcalEl = document.getElementById(`kcal-${mIdx}-${rIdx}`);

            if (!row.selectedBase || isNaN(amount) || amount <= 0) {
                row.macros = { p: 0, c: 0, f: 0, kcal: 0 };
                if (kcalEl) kcalEl.innerHTML = `0 <small>kcal</small>`;
                updateMealSummary(mIdx);
                updateDailyTotals();
                saveState();
                return;
            }

            let multiplier = 0;
            if (row.unit === 'gr' || row.unit === 'ml') {
                multiplier = amount / 100;
            } else if (row.unit === 'adet') {
                multiplier = (amount * (row.selectedBase.unitWeight || 100)) / 100;
            }

            row.macros = {
                p: row.selectedBase.p * multiplier,
                c: row.selectedBase.c * multiplier,
                f: row.selectedBase.f * multiplier,
                kcal: row.selectedBase.kcal * multiplier
            };

            if (kcalEl) {
                kcalEl.innerHTML = `${Math.round(row.macros.kcal)} <small>kcal</small>`;
            }

            updateMealSummary(mIdx);
            updateDailyTotals();
            saveState();
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.food-row-wrapper')) {
                document.querySelectorAll('.suggestions-dropdown').forEach(el => el.classList.add('hidden'));
            }
        });

        function getDailyTotals() {
            return appState.reduce((acc, meal) => {
                meal.rows.forEach(r => {
                    acc.p += r.macros.p;
                    acc.c += r.macros.c;
                    acc.f += r.macros.f;
                    acc.kcal += r.macros.kcal;
                });
                return acc;
            }, { p: 0, c: 0, f: 0, kcal: 0 });
        }

        function updateMealSummary(mIdx) {
            const meal = appState[mIdx];
            const totals = meal.rows.reduce((acc, r) => {
                acc.p += r.macros.p;
                acc.c += r.macros.c;
                acc.f += r.macros.f;
                acc.kcal += r.macros.kcal;
                return acc;
            }, { p: 0, c: 0, f: 0, kcal: 0 });

            const summaryEl = document.getElementById(`summary-${mIdx}`);
            if (summaryEl) {
                summaryEl.innerHTML = `
                    <span>P: <strong>${totals.p.toFixed(1)}g</strong> · K: <strong>${totals.c.toFixed(1)}g</strong> · Y: <strong>${totals.f.toFixed(1)}g</strong></span>
                    <span class="kcal-highlight">${Math.round(totals.kcal)} kcal</span>
                `;
            }
        }

        function updateDailyTotals() {
            const daily = getDailyTotals();
            document.getElementById('total-p').innerText = `${daily.p.toFixed(1)}g`;
            document.getElementById('total-c').innerText = `${daily.c.toFixed(1)}g`;
            document.getElementById('total-f').innerText = `${daily.f.toFixed(1)}g`;
            document.getElementById('total-kcal').innerText = `${Math.round(daily.kcal)} kcal`;
        }

        function buildCurrentRecord() {
            const totals = getDailyTotals();
            const now = new Date();
            const dateStr = now.toLocaleDateString('tr-TR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });

            const filledMeals = appState
                .map(m => ({
                    name: m.name,
                    items: m.rows
                        .filter(r => r.food.trim() && parseFloat(r.amount) > 0)
                        .map(r => `${r.amount} ${r.unit} ${r.food} (${Math.round(r.macros.kcal)} kcal)`)
                }))
                .filter(m => m.items.length > 0);

            return {
                id: dateStr,
                date: dateStr,
                totals: {
                    p: Number(totals.p.toFixed(1)),
                    c: Number(totals.c.toFixed(1)),
                    f: Number(totals.f.toFixed(1)),
                    kcal: Math.round(totals.kcal)
                },
                meals: filledMeals
            };
        }

        function formatRecordForShare(record) {
            let text = `📅 ${record.date} Beslenme Özeti\n`;
            text += `🔥 Toplam: ${record.totals.kcal} kcal\n`;
            text += `📊 Makrolar: ${record.totals.p}g Protein | ${record.totals.c}g Karb | ${record.totals.f}g Yağ\n\n`;
            record.meals.forEach(m => {
                text += `▪ ${m.name}:\n`;
                m.items.forEach(item => {
                    text += `  - ${item}\n`;
                });
            });
            return text.trim();
        }

        async function triggerShare(record) {
            const shareText = formatRecordForShare(record);
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: `${record.date} Gün Sonu Özeti`,
                        text: shareText
                    });
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(shareText);
                alert("Gün sonu özeti panoya kopyalandı! Sohbete yapıştırabilirsin.");
            } else {
                prompt("Metni kopyala:", shareText);
            }
        }

        function shareCurrentDay() {
            const record = buildCurrentRecord();
            if (record.totals.kcal <= 0) {
                alert("Paylaşmak için en az bir besin girmelisin.");
                return;
            }
            triggerShare(record);
        }

        function shareHistoryItem(idx) {
            const record = historyData[idx];
            if (record) triggerShare(record);
        }

        function saveDayToHistory() {
            const record = buildCurrentRecord();
            if (record.totals.kcal <= 0) {
                alert("Kaydetmek için en az bir besin seçmelisin.");
                return;
            }

            const existingIdx = historyData.findIndex(item => item.id === record.id);
            if (existingIdx > -1) {
                historyData[existingIdx] = record;
            } else {
                historyData.unshift(record);
            }

            saveHistoryStorage();
            alert(`${record.date} tarihi ${record.totals.kcal} kcal olarak depoya kaydedildi.`);
        }

        function renderHistory() {
            const listEl = document.getElementById('history-list');
            if (historyData.length === 0) {
                listEl.innerHTML = `<p style="color: var(--text-muted); text-align: center; margin-top: 40px; font-size: 0.9rem;">Henüz kaydedilmiş bir gün yok.</p>`;
                return;
            }

            listEl.innerHTML = historyData.map((item, idx) => {
                const mealsHtml = item.meals.map(m => `
                    <div class="history-meal-item">
                        <strong>${m.name}:</strong> ${m.items.join(', ')}
                    </div>
                `).join('');

                return `
                    <div class="history-card" id="hist-${idx}">
                        <div class="history-top" onclick="document.getElementById('hist-${idx}').classList.toggle('open')">
                            <span class="history-date">${item.date}</span>
                            <span class="history-kcal">${item.totals.kcal} kcal</span>
                        </div>
                        <div class="history-macros">
                            <span>Protein: ${item.totals.p}g · Karb: ${item.totals.c}g · Yağ: ${item.totals.f}g</span>
                            <span>▼</span>
                        </div>
                        <div class="history-details">
                            ${mealsHtml}
                            <div class="history-card-actions">
                                <button class="share-history-btn" onclick="shareHistoryItem(${idx})">Paylaş / Kopyala</button>
                                <button class="delete-history-btn" onclick="deleteHistoryItem(${idx})">Kaydı Sil</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function deleteHistoryItem(idx) {
            if (confirm("Bu günün kaydını silmek istiyor musun?")) {
                historyData.splice(idx, 1);
                saveHistoryStorage();
                renderHistory();
            }
        }

        function resetDay() {
            if (confirm("Mevcut ekranı yeni gün için temizlemek istiyor musun?")) {
                appState = initDefaultState();
                saveState();
                renderApp();
            }
        }

        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(historyData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `makro_gecmis_yedek.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        historyData = imported;
                        saveHistoryStorage();
                        renderHistory();
                        alert("Yedek başarıyla yüklendi.");
                    }
                } catch (err) {
                    alert("Geçersiz yedek dosyası.");
                }
            };
            reader.readAsText(file);
        }

        renderApp();
    </script>
</body>
</html>
