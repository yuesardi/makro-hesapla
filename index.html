<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Makro & Kalori Takip</title>
    <style>
        :root {
            --bg-main: #0d0d0d;
            --bg-card: #18181b;
            --bg-input: #27272a;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent-red: #e11d48;
            --border-color: #2e2e32;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 16px; padding-bottom: 135px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
        header h1 { font-size: 1.3rem; font-weight: 800; }
        header h1 span { color: var(--accent-red); }
        .header-right { display: flex; gap: 6px; align-items: center; }
        .tab-btn, .key-btn { background-color: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .tab-btn.active { background-color: var(--accent-red); border-color: var(--accent-red); color: var(--text-main); }
        .key-btn.configured { border-color: #22c55e; color: #4ade80; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
        .modal-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 18px; width: 100%; max-width: 380px; }
        .modal-box h3 { font-size: 1rem; margin-bottom: 8px; }
        .modal-box p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
        .test-result { margin-top: 10px; font-size: 0.78rem; padding: 8px; border-radius: 8px; background: #0d0d0d; word-break: break-word; }
        .meal-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
        .meal-card.locked { border-color: #3f3f46; background-color: #121214; }
        .meal-card.locked .rows-container, .meal-card.locked .add-row-btn { pointer-events: none; opacity: 0.55; }
        .meal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .meal-title { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .meal-title::before { content: ""; display: inline-block; width: 4px; height: 16px; background-color: var(--accent-red); border-radius: 2px; }
        .lock-badge { font-size: 0.75rem; color: var(--accent-red); font-weight: 600; display: none; }
        .meal-card.locked .lock-badge { display: inline; }
        .food-row-wrapper { position: relative; margin-bottom: 8px; }
        .food-row { display: grid; grid-template-columns: 60px 54px 1fr 56px; gap: 6px; align-items: center; }
        select, input { background-color: var(--bg-input); border: 1px solid transparent; color: var(--text-main); padding: 9px 6px; border-radius: 8px; font-size: 0.85rem; width: 100%; outline: none; }
        select:focus, input:focus { border-color: var(--accent-red); }
        input[type="number"] { text-align: center; }
        .row-kcal { text-align: right; font-size: 0.85rem; font-weight: 700; white-space: nowrap; }
        .row-kcal small { color: var(--text-muted); font-weight: 400; font-size: 0.7rem; }
        .suggestions-dropdown { position: absolute; top: 100%; left: 0; right: 0; background-color: #202024; border: 1px solid var(--accent-red); border-radius: 10px; margin-top: 4px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.85); overflow: hidden; }
        .suggestion-item { padding: 10px 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .suggestion-item:last-child { border-bottom: none; }
        .sug-name { font-size: 0.85rem; font-weight: 600; }
        .sug-meta { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
        .sug-kcal { font-size: 0.8rem; font-weight: 700; color: var(--accent-red); white-space: nowrap; }
        .meal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-color); }
        .add-row-btn { background: transparent; border: 1px dashed var(--text-muted); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
        .toggle-lock-btn { background-color: var(--accent-red); color: var(--text-main); border: none; padding: 7px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .meal-card.locked .toggle-lock-btn { background-color: var(--bg-input); border: 1px solid var(--text-muted); }
        .meal-summary { margin-top: 10px; background-color: #0d0d0d; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; }
        .meal-summary strong { color: var(--text-main); }
        .meal-summary .kcal-highlight { color: var(--accent-red); font-weight: 700; }
        .history-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .backup-btn { background-color: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 7px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
        .history-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
        .history-top { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .history-date { font-weight: 700; font-size: 0.95rem; }
        .history-kcal { color: var(--accent-red); font-weight: 800; font-size: 1.05rem; }
        .history-macros { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; display: flex; justify-content: space-between; }
        .history-details { display: none; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-muted); }
        .history-card.open .history-details { display: block; }
        .history-meal-item { margin-bottom: 6px; }
        .history-meal-item strong { color: var(--text-main); }
        .history-card-actions { display: flex; gap: 8px; margin-top: 10px; }
        .share-history-btn { background-color: var(--accent-red); border: none; color: var(--text-main); padding: 5px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
        .delete-history-btn { background: transparent; border: 1px solid #52525b; color: #a1a1aa; padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
        .daily-footer { position: fixed; bottom: 0; left: 0; right: 0; background-color: #141417; border-top: 2px solid var(--accent-red); padding: 12px 16px; z-index: 100; }
        .daily-footer-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 6px; }
        .daily-footer-title { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .footer-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .reset-btn, .share-day-btn { background: transparent; border: 1px solid #52525b; color: var(--text-main); padding: 5px 9px; border-radius: 6px; font-size: 0.73rem; font-weight: 600; cursor: pointer; }
        .share-day-btn { border-color: var(--accent-red); color: var(--accent-red); }
        .save-day-btn { background-color: var(--accent-red); border: none; color: var(--text-main); padding: 5px 11px; border-radius: 6px; font-size: 0.73rem; font-weight: 700; cursor: pointer; }
        .daily-stats { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .macro-group { display: flex; gap: 12px; }
        .macro-item span { color: var(--text-muted); font-size: 0.75rem; }
        .total-kcal { font-size: 1.15rem; font-weight: 800; color: var(--accent-red); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header>
        <h1>MAKRO<span>TAKİP</span></h1>
        <div class="header-right">
            <button class="key-btn" id="ai-key-btn" onclick="openKeyModal()">🔑 AI</button>
            <button class="tab-btn active" id="tab-daily" onclick="switchTab('daily')">Günlük</button>
            <button class="tab-btn" id="tab-history" onclick="switchTab('history')">Geçmiş (<span id="history-count">0</span>)</button>
        </div>
    </header>

    <div class="modal-overlay hidden" id="key-modal">
        <div class="modal-box">
            <h3>Gemini AI Bağlantısı</h3>
            <p>API anahtarını yapıştır ve Test Et'e bas. Sadece cihazında saklanır.</p>
            <input type="password" id="gemini-key-input" placeholder="AQ... veya AIza...">
            <div class="test-result hidden" id="test-result"></div>
            <div class="modal-actions">
                <button class="reset-btn" onclick="testApiConnection()">Test Et</button>
                <button class="reset-btn" onclick="closeKeyModal()">Kapat</button>
                <button class="save-day-btn" onclick="saveApiKey()">Kaydet</button>
            </div>
        </div>
    </div>

    <div id="daily-view"><div id="meals-wrapper"></div></div>

    <div id="history-view" class="hidden">
        <div class="history-controls">
            <span style="font-size: 0.8rem; color: var(--text-muted);">Detay için güne dokun</span>
            <div>
                <button class="backup-btn" onclick="exportBackup()">Yedek İndir</button>
                <button class="backup-btn" onclick="document.getElementById('import-file').click()">Yükle</button>
                <input type="file" id="import-file" accept=".json" class="hidden" onchange="importBackup(event)">
            </div>
        </div>
        <div id="history-list"></div>
    </div>

    <div class="daily-footer" id="daily-footer">
        <div class="daily-footer-top">
            <span class="daily-footer-title" id="matched-status">Hazır</span>
            <div class="footer-actions">
                <button class="reset-btn" onclick="resetDay()">Temizle</button>
                <button class="share-day-btn" onclick="shareCurrentDay()">Paylaş</button>
                <button class="save-day-btn" onclick="saveDayToHistory()">Kaydet</button>
            </div>
        </div>
        <div class="daily-stats">
            <div class="macro-group">
                <div class="macro-item"><span>P:</span> <strong id="total-p">0g</strong></div>
                <div class="macro-item"><span>K:</span> <strong id="total-c">0g</strong></div>
                <div class="macro-item"><span>Y:</span> <strong id="total-f">0g</strong></div>
            </div>
            <div class="total-kcal" id="total-kcal">0 kcal</div>
        </div>
    </div>

    <script>
        const MEAL_NAMES = ["Sabah", "Ara Öğün 1", "Öğlen", "Ara Öğün 2", "Akşam", "Ara Öğün 3"];
        const MODEL_NAME = "gemini-3.8-flash";
        const aiCache = {};

        let geminiApiKey = localStorage.getItem('gemini_api_key') || '';
        let appState = JSON.parse(localStorage.getItem('macroAppState_v3')) || initDefaultState();
        let historyData = JSON.parse(localStorage.getItem('macroHistory_v1')) || [];

        function initDefaultState() {
            return MEAL_NAMES.map(name => ({
                name, locked: false,
                rows: Array.from({ length: 4 }, () => ({ unit: 'gr', amount: '', food: '', selectedBase: null, macros: { p: 0, c: 0, f: 0, kcal: 0 } }))
            }));
        }

        function saveState() { localStorage.setItem('macroAppState_v3', JSON.stringify(appState)); }
        function saveHistoryStorage() {
            localStorage.setItem('macroHistory_v1', JSON.stringify(historyData));
            document.getElementById('history-count').innerText = historyData.length;
        }

        function updateKeyButtonUI() {
            const btn = document.getElementById('ai-key-btn');
            btn.classList.toggle('configured', !!geminiApiKey);
            btn.innerText = geminiApiKey ? '🔑 AI Aktif' : '🔑 AI Ekle';
        }

        function openKeyModal() {
            document.getElementById('gemini-key-input').value = geminiApiKey;
            document.getElementById('test-result').classList.add('hidden');
            document.getElementById('key-modal').classList.remove('hidden');
        }
        function closeKeyModal() { document.getElementById('key-modal').classList.add('hidden'); }

        function saveApiKey() {
            geminiApiKey = document.getElementById('gemini-key-input').value.trim();
            localStorage.setItem('gemini_api_key', geminiApiKey);
            updateKeyButtonUI();
            closeKeyModal();
        }

        async function callGeminiWithTimeout(promptText, keyToUse) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${encodeURIComponent(keyToUse)}`;

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                const data = await res.json();
                if (!res.ok) throw new Error(`${res.status}: ${data.error?.message || 'API Reddetti'}`);
                return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
            } catch (err) {
                clearTimeout(timeoutId);
                if (err.name === 'AbortError') throw new Error("Zaman aşımı (10 sn) - Ağ yanıt vermedi");
                throw err;
            }
        }

        async function testApiConnection() {
            const key = document.getElementById('gemini-key-input').value.trim();
            const resBox = document.getElementById('test-result');
            resBox.classList.remove('hidden');
            if (!key) { resBox.innerText = "❌ Önce anahtar gir."; return; }
            resBox.innerText = "⏳ Bağlanıyor...";
            try {
                const reply = await callGeminiWithTimeout("Sadece 'BAĞLANDI' yaz.", key);
                resBox.innerText = `✅ Başarılı (${MODEL_NAME}): ${reply}`;
            } catch (e) {
                resBox.innerText = `❌ Hata: ${e.message}`;
            }
        }

        function switchTab(tab) {
            document.getElementById('daily-view').classList.toggle('hidden', tab !== 'daily');
            document.getElementById('daily-footer').classList.toggle('hidden', tab !== 'daily');
            document.getElementById('history-view').classList.toggle('hidden', tab === 'daily');
            document.getElementById('tab-daily').classList.toggle('active', tab === 'daily');
            document.getElementById('tab-history').classList.toggle('active', tab !== 'daily');
            if (tab !== 'daily') renderHistory();
        }

        function renderApp() {
            const wrapper = document.getElementById('meals-wrapper');
            wrapper.innerHTML = '';
            appState.forEach((meal, mIdx) => {
                const card = document.createElement('div');
                card.className = `meal-card ${meal.locked ? 'locked' : ''}`;
                let rowsHtml = meal.rows.map((row, rIdx) => `
                    <div class="food-row-wrapper">
                        <div class="food-row">
                            <select onchange="handleUnitOrAmountChange(${mIdx}, ${rIdx}, 'unit', this.value)">
                                <option value="adet" ${row.unit === 'adet' ? 'selected' : ''}>Adet</option>
                                <option value="gr" ${row.unit === 'gr' ? 'selected' : ''}>Gr</option>
                                <option value="ml" ${row.unit === 'ml' ? 'selected' : ''}>Ml</option>
                            </select>
                            <input type="number" inputmode="decimal" placeholder="0" value="${row.amount}" oninput="handleUnitOrAmountChange(${mIdx}, ${rIdx}, 'amount', this.value)">
                            <input type="text" placeholder="Ürün adı..." value="${row.food}" oninput="handleFoodInput(${mIdx}, ${rIdx}, this.value)">
                            <div class="row-kcal" id="kcal-${mIdx}-${rIdx}">${Math.round(row.macros.kcal)} <small>kcal</small></div>
                        </div>
                        <div class="suggestions-dropdown hidden" id="sug-${mIdx}-${rIdx}"></div>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="meal-header"><div class="meal-title">${meal.name}</div><span class="lock-badge">🔒 Kilitli</span></div>
                    <div class="rows-container">${rowsHtml}</div>
                    <div class="meal-actions">
                        <button class="add-row-btn" onclick="addRow(${mIdx})">+ Satır Ekle</button>
                        <button class="toggle-lock-btn" onclick="toggleLock(${mIdx})">${meal.locked ? 'Düzenle' : 'Tamam'}</button>
                    </div>
                    <div class="meal-summary" id="summary-${mIdx}"></div>
                `;
                wrapper.appendChild(card);
                updateMealSummary(mIdx);
            });
            updateDailyTotals();
            updateKeyButtonUI();
            document.getElementById('history-count').innerText = historyData.length;
        }

        function addRow(mIdx) {
            appState[mIdx].rows.push({ unit: 'gr', amount: '', food: '', selectedBase: null, macros: { p: 0, c: 0, f: 0, kcal: 0 } });
            saveState(); renderApp();
        }
        function toggleLock(mIdx) { appState[mIdx].locked = !appState[mIdx].locked; saveState(); renderApp(); }

        async function searchFoodOptions(query) {
            const cleanQuery = query.trim().toLowerCase();
            if (!cleanQuery) return [];
            if (aiCache[cleanQuery]) return aiCache[cleanQuery];

            const statusEl = document.getElementById('matched-status');
            if (!geminiApiKey) { statusEl.innerText = "Önce 🔑 AI Ekle"; return []; }

            statusEl.innerText = "🤖 AI hesaplıyor...";
            const prompt = `"${query}" için Türkiye'de en yaygın 4 çeşidi 100g/ml besin değerleriyle SADECE JSON dizisi olarak döndür. Başka hiçbir metin yazma: [{"name":"Ürün Adı","p":10,"c":5,"f":18,"kcal":220,"unitWeight":30}]`;

            try {
                const raw = await callGeminiWithTimeout(prompt, geminiApiKey);
                const jsonMatch = raw.match(/\[[\s\S]*\]/);
                if (!jsonMatch) throw new Error("Geçersiz AI yanıtı");
                const parsed = JSON.parse(jsonMatch[0]);
                aiCache[cleanQuery] = parsed;
                statusEl.innerText = "🤖 AI Yanıtladı";
                return parsed;
            } catch (err) {
                statusEl.innerText = `❌ ${err.message}`;
                return [];
            }
        }

        let debounceTimers = {};
        function handleFoodInput(mIdx, rIdx, value) {
            const row = appState[mIdx].rows[rIdx];
            row.food = value;
            saveState();
            const timerKey = `${mIdx}-${rIdx}`;
            clearTimeout(debounceTimers[timerKey]);
            const sugBox = document.getElementById(`sug-${mIdx}-${rIdx}`);
            if (value.trim().length < 2) { sugBox.classList.add('hidden'); return; }

            debounceTimers[timerKey] = setTimeout(async () => {
                const options = await searchFoodOptions(value);
                if (!options.length) { sugBox.classList.add('hidden'); return; }
                row.selectedBase = options[0];
                recalculateRow(mIdx, rIdx);
                sugBox.innerHTML = options.map(opt => `
                    <div class="suggestion-item" onclick='selectFoodOption(${mIdx}, ${rIdx}, ${JSON.stringify(opt).replace(/'/g, "&apos;")})'>
                        <div><div class="sug-name">${opt.name}</div><div class="sug-meta">100g: P ${opt.p}g · K ${opt.c}g · Y ${opt.f}g</div></div>
                        <div class="sug-kcal">${Math.round(opt.kcal)} kcal</div>
                    </div>
                `).join('');
                sugBox.classList.remove('hidden');
            }, 600);
        }

        function selectFoodOption(mIdx, rIdx, option) {
            const row = appState[mIdx].rows[rIdx];
            row.food = option.name;
            row.selectedBase = option;
            const wrapper = document.getElementById(`sug-${mIdx}-${rIdx}`).parentElement;
            wrapper.querySelector('input[type="text"]').value = option.name;
            document.getElementById(`sug-${mIdx}-${rIdx}`).classList.add('hidden');
            recalculateRow(mIdx, rIdx);
        }

        function handleUnitOrAmountChange(mIdx, rIdx, field, value) {
            appState[mIdx].rows[rIdx][field] = value;
            recalculateRow(mIdx, rIdx);
        }

        function recalculateRow(mIdx, rIdx) {
            const row = appState[mIdx].rows[rIdx];
            const amount = parseFloat(row.amount);
            const kcalEl = document.getElementById(`kcal-${mIdx}-${rIdx}`);
            if (!row.selectedBase || isNaN(amount) || amount <= 0) {
                row.macros = { p: 0, c: 0, f: 0, kcal: 0 };
                if (kcalEl) kcalEl.innerHTML = `0 <small>kcal</small>`;
                updateMealSummary(mIdx); updateDailyTotals(); saveState(); return;
            }
            const mult = row.unit === 'adet' ? (amount * (row.selectedBase.unitWeight || 100)) / 100 : amount / 100;
            row.macros = { p: row.selectedBase.p * mult, c: row.selectedBase.c * mult, f: row.selectedBase.f * mult, kcal: row.selectedBase.kcal * mult };
            if (kcalEl) kcalEl.innerHTML = `${Math.round(row.macros.kcal)} <small>kcal</small>`;
            updateMealSummary(mIdx); updateDailyTotals(); saveState();
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.food-row-wrapper')) document.querySelectorAll('.suggestions-dropdown').forEach(el => el.classList.add('hidden'));
        });

        function getDailyTotals() {
            return appState.reduce((acc, m) => {
                m.rows.forEach(r => { acc.p += r.macros.p; acc.c += r.macros.c; acc.f += r.macros.f; acc.kcal += r.macros.kcal; });
                return acc;
            }, { p: 0, c: 0, f: 0, kcal: 0 });
        }

        function updateMealSummary(mIdx) {
            const t = appState[mIdx].rows.reduce((a, r) => ({ p: a.p + r.macros.p, c: a.c + r.macros.c, f: a.f + r.macros.f, kcal: a.kcal + r.macros.kcal }), { p: 0, c: 0, f: 0, kcal: 0 });
            const el = document.getElementById(`summary-${mIdx}`);
            if (el) el.innerHTML = `<span>P: <strong>${t.p.toFixed(1)}g</strong> · K: <strong>${t.c.toFixed(1)}g</strong> · Y: <strong>${t.f.toFixed(1)}g</strong></span><span class="kcal-highlight">${Math.round(t.kcal)} kcal</span>`;
        }

        function updateDailyTotals() {
            const d = getDailyTotals();
            document.getElementById('total-p').innerText = `${d.p.toFixed(1)}g`;
            document.getElementById('total-c').innerText = `${d.c.toFixed(1)}g`;
            document.getElementById('total-f').innerText = `${d.f.toFixed(1)}g`;
            document.getElementById('total-kcal').innerText = `${Math.round(d.kcal)} kcal`;
        }

        function buildCurrentRecord() {
            const totals = getDailyTotals();
            const dateStr = new Date().toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const meals = appState.map(m => ({
                name: m.name,
                items: m.rows.filter(r => r.food.trim() && parseFloat(r.amount) > 0).map(r => `${r.amount} ${r.unit} ${r.food} (${Math.round(r.macros.kcal)} kcal)`)
            })).filter(m => m.items.length > 0);
            return { id: dateStr, date: dateStr, totals: { p: +totals.p.toFixed(1), c: +totals.c.toFixed(1), f: +totals.f.toFixed(1), kcal: Math.round(totals.kcal) }, meals };
        }

        async function triggerShare(record) {
            let text = `📅 ${record.date} Beslenme Özeti\n🔥 Toplam: ${record.totals.kcal} kcal\n📊 Makrolar: ${record.totals.p}g P | ${record.totals.c}g K | ${record.totals.f}g Y\n\n`;
            record.meals.forEach(m => { text += `▪ ${m.name}:\n` + m.items.map(i => `  - ${i}`).join('\n') + '\n'; });
            if (navigator.share) { try { await navigator.share({ text: text.trim() }); return; } catch (e) {} }
            await navigator.clipboard.writeText(text.trim());
            alert("Panoya kopyalandı!");
        }

        function shareCurrentDay() { const r = buildCurrentRecord(); if (r.totals.kcal > 0) triggerShare(r); }
        function shareHistoryItem(idx) { if (historyData[idx]) triggerShare(historyData[idx]); }

        function saveDayToHistory() {
            const r = buildCurrentRecord();
            if (r.totals.kcal <= 0) return alert("Besin girilmedi.");
            const idx = historyData.findIndex(i => i.id === r.id);
            if (idx > -1) historyData[idx] = r; else historyData.unshift(r);
            saveHistoryStorage();
            alert(`${r.date} kaydedildi.`);
        }

        function renderHistory() {
            const listEl = document.getElementById('history-list');
            if (!historyData.length) { listEl.innerHTML = `<p style="color:var(--text-muted);text-align:center;margin-top:40px;">Kayıt yok.</p>`; return; }
            listEl.innerHTML = historyData.map((item, idx) => `
                <div class="history-card" id="hist-${idx}">
                    <div class="history-top" onclick="document.getElementById('hist-${idx}').classList.toggle('open')">
                        <span class="history-date">${item.date}</span><span class="history-kcal">${item.totals.kcal} kcal</span>
                    </div>
                    <div class="history-macros"><span>P: ${item.totals.p}g · K: ${item.totals.c}g · Y: ${item.totals.f}g</span><span>▼</span></div>
                    <div class="history-details">
                        ${item.meals.map(m => `<div class="history-meal-item"><strong>${m.name}:</strong> ${m.items.join(', ')}</div>`).join('')}
                        <div class="history-card-actions">
                            <button class="share-history-btn" onclick="shareHistoryItem(${idx})">Paylaş</button>
                            <button class="delete-history-btn" onclick="deleteHistoryItem(${idx})">Sil</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function deleteHistoryItem(idx) { if (confirm("Silinsin mi?")) { historyData.splice(idx, 1); saveHistoryStorage(); renderHistory(); } }
        function resetDay() { if (confirm("Ekran temizlensin mi?")) { appState = initDefaultState(); saveState(); renderApp(); } }
        function exportBackup() {
            const a = document.createElement('a');
            a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(historyData));
            a.download = "makro_yedek.json"; a.click();
        }
        function importBackup(e) {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = ev => { historyData = JSON.parse(ev.target.result); saveHistoryStorage(); renderHistory(); };
            r.readAsText(f);
        }

        renderApp();
    </script>
</body>
</html>
